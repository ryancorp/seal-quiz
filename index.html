<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Kind of Seal Are You?</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ocean-dark: #0a1628;
    --ocean-mid: #1a3a5c;
    --ocean-blue: #1e5f8a;
    --ocean-light: #4a9abb;
    --overlay: rgba(15, 40, 80, 0.72);
    --card-bg: rgba(20, 55, 100, 0.78);
    --card-border: rgba(100, 180, 220, 0.25);
    --btn-bg: rgba(30, 50, 80, 0.85);
    --btn-hover: rgba(50, 90, 140, 0.95);
    --text-white: #f0f8ff;
    --text-muted: rgba(200, 230, 255, 0.75);
    --accent: #f5c842;
    --accent2: #5bc8f0;
  }

  html, body {
    min-height: unset;
    font-family: 'Roboto', sans-serif;
    color: var(--text-white);
    overflow-x: hidden;
  }

  body {
    background: var(--ocean-dark);
    position: relative;
  }

  /* Animated ocean background */
  .ocean-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(26,90,140,0.6) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(10,60,100,0.5) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, rgba(15,45,90,0.7) 0%, transparent 55%),
      linear-gradient(180deg, #061220 0%, #0d2a4a 30%, #1a4a70 60%, #0d2a4a 100%);
    overflow: hidden;
  }

  .wave-layer {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 2px,
        rgba(74,154,187,0.04) 2px,
        rgba(74,154,187,0.04) 4px
      );
    animation: waveDrift 20s linear infinite;
  }

  .wave-layer-2 {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 120% 40% at 50% 110%, rgba(74,154,187,0.15) 0%, transparent 60%),
      radial-gradient(ellipse 80% 30% at 20% 90%, rgba(91,200,240,0.08) 0%, transparent 50%);
    animation: wavePulse 8s ease-in-out infinite alternate;
  }

  .foam {
    position: absolute;
    bottom: 0;
    left: -10%;
    width: 120%;
    height: 200px;
    background: radial-gradient(ellipse 100% 100% at 50% 100%, rgba(91,200,240,0.12) 0%, transparent 70%);
    animation: foamRise 6s ease-in-out infinite alternate;
  }

  @keyframes waveDrift {
    0% { transform: translateX(0) translateY(0); }
    100% { transform: translateX(-40px) translateY(-20px); }
  }
  @keyframes wavePulse {
    0% { opacity: 0.6; transform: scaleY(1); }
    100% { opacity: 1; transform: scaleY(1.1); }
  }
  @keyframes foamRise {
    0% { transform: translateY(10px); opacity: 0.5; }
    100% { transform: translateY(-10px); opacity: 1; }
  }

  /* Bubbles */
  .bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3), rgba(91,200,240,0.05));
    border: 1px solid rgba(91,200,240,0.2);
    animation: bubbleRise linear infinite;
  }

  @keyframes bubbleRise {
    0% { transform: translateY(100vh) translateX(0); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.3; }
    100% { transform: translateY(-100px) translateX(30px); opacity: 0; }
  }

  /* Layout */
  .app {
    position: relative;
    z-index: 2;
    min-height: unset;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .screen {
    display: none;
    width: 100%;
    max-width: 680px;
    animation: fadeUp 0.5s ease forwards;
  }
  .screen.active { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Card */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 40px 36px;
    backdrop-filter: blur(16px);
    box-shadow:
      0 8px 40px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }

  /* Intro screen */
  .hero-image {
    width: 100%;
    height: 260px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 28px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .hero-placeholder {
    width: 100%;
    height: 260px;
    border-radius: 12px;
    margin-bottom: 28px;
    background: linear-gradient(135deg, #0d3a5c, #1a6080, #0d3a5c);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .quiz-title {
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 900;
    text-align: center;
    color: var(--text-white);
    line-height: 1.15;
    margin-bottom: 16px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }

  .quiz-subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .btn-start {
    display: block;
    width: 100%;
    max-width: 280px;
    margin: 0 auto;
    padding: 16px 32px;
    background: var(--accent);
    color: #1a2a00;
    font-family: 'Roboto', sans-serif;
    font-weight: 700;
    font-size: 18px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    box-shadow: 0 4px 20px rgba(245,200,66,0.35);
    letter-spacing: 0.5px;
  }
  .btn-start:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 8px 28px rgba(245,200,66,0.5);
    background: #ffd83a;
  }

  /* Progress */
  .progress-wrap {
    margin-bottom: 28px;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .progress-bar-bg {
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Question */
  .question-text {
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(20px, 3.5vw, 28px);
    font-weight: 700;
    text-align: center;
    line-height: 1.35;
    margin-bottom: 28px;
    color: var(--text-white);
    text-shadow: 0 1px 8px rgba(0,0,0,0.4);
  }

  .answers-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .answer-btn {
    width: 100%;
    padding: 16px 20px;
    background: var(--btn-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    color: var(--text-white);
    font-family: 'Roboto', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s ease;
    line-height: 1.4;
    backdrop-filter: blur(8px);
  }
  .answer-btn:hover {
    background: var(--btn-hover);
    border-color: rgba(91,200,240,0.5);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    color: #fff;
  }
  .answer-btn.selected {
    background: linear-gradient(135deg, rgba(91,200,240,0.3), rgba(26,90,140,0.6));
    border-color: var(--accent2);
    box-shadow: 0 0 0 2px rgba(91,200,240,0.3), 0 4px 16px rgba(0,0,0,0.3);
  }
  .answer-btn:disabled { cursor: default; }

  /* Result screen */
  .result-seal-name {
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 900;
    text-align: center;
    margin-bottom: 24px;
    color: var(--text-white);
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }

  .result-image-wrap {
    width: 100%;
    height: 280px;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 24px;
    box-shadow: 0 6px 30px rgba(0,0,0,0.45);
    background: linear-gradient(135deg, #0d3a5c, #1a6080);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
  }

  .result-image-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .result-description {
    text-align: center;
    font-size: 16px;
    line-height: 1.7;
    color: var(--text-muted);
    margin-bottom: 28px;
  }

  .share-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .share-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 22px;
    border: none;
    border-radius: 8px;
    font-family: 'Roboto', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
    text-decoration: none;
  }
  .share-btn:hover { transform: translateY(-2px); opacity: 0.92; }
  .share-btn.facebook { background: #1877f2; color: #fff; }
  .share-btn.twitter { background: #000; color: #fff; }
  .share-btn svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }

  .btn-retake {
    display: block;
    width: 100%;
    max-width: 260px;
    margin: 0 auto;
    padding: 13px 28px;
    background: transparent;
    border: 2px solid rgba(91,200,240,0.5);
    border-radius: 50px;
    color: var(--accent2);
    font-family: 'Roboto', sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }
  .btn-retake:hover {
    background: rgba(91,200,240,0.1);
    border-color: var(--accent2);
  }

  /* Sealo branding */
  .sealo-badge {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: rgba(200,230,255,0.35);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .sealo-badge a { color: inherit; text-decoration: none; }
  .sealo-badge a:hover { color: rgba(200,230,255,0.6); }

  @media (max-width: 480px) {
    .card { padding: 28px 20px; }
    .result-image-wrap { height: 220px; }
  }
</style>
</head>

// ─── STATE ───────────────────────────────────────────────────────────────────

let currentQ = 0;
let scores = {};

function initScores() {
  scores = {};
  Object.keys(seals).forEach(k => scores[k] = 0);
}

// ─── BUBBLES ─────────────────────────────────────────────────────────────────

function createBubbles() {
  const container = document.getElementById('bubbles');
  for (let i = 0; i < 18; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = Math.random() * 14 + 4;
    b.style.cssText = `
      width: ${size}px;
      height: ${size}px;
      left: ${Math.random() * 100}%;
      bottom: -20px;
      animation-duration: ${Math.random() * 12 + 8}s;
      animation-delay: ${Math.random() * 10}s;
    `;
    container.appendChild(b);
  }
}

// ─── QUIZ LOGIC ──────────────────────────────────────────────────────────────

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  el.classList.add('active');
  el.style.animation = 'none';
  el.offsetHeight;
  el.style.animation = '';
}

function startQuiz() {
  initScores();
  currentQ = 0;
  renderQuestion();
  showScreen('screen-question');
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('q-num').textContent = currentQ + 1;
  const pct = Math.round((currentQ / questions.length) * 100);
  document.getElementById('q-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('question-text').textContent = q.text;

  const grid = document.getElementById('answers-grid');
  grid.innerHTML = '';
  q.answers.forEach((a, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = a.text;
    btn.onclick = () => selectAnswer(i);
    grid.appendChild(btn);
  });
}

function selectAnswer(index) {
  const btns = document.querySelectorAll('.answer-btn');
  btns.forEach(b => b.disabled = true);
  btns[index].classList.add('selected');

  const answer = questions[currentQ].answers[index];
  Object.entries(answer.scores).forEach(([seal, val]) => {
    scores[seal] = (scores[seal] || 0) + val;
  });

  setTimeout(() => {
    currentQ++;
    if (currentQ < questions.length) {
      renderQuestion();
    } else {
      showResult();
    }
  }, 380);
}

function showResult() {
  document.getElementById('progress-fill').style.width = '100%';

  let topSeal = Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];
  const seal = seals[topSeal];

  document.getElementById('result-title').textContent = "You're a " + seal.name + "!";
  document.getElementById('result-description').textContent = seal.description;

  const imgWrap = document.getElementById('result-image-wrap');
  if (seal.image) {
    imgWrap.innerHTML = `<img src="${seal.image}" alt="${seal.name}">`;
  } else {
    imgWrap.textContent = seal.emoji;
  }

  const shareText = encodeURIComponent(`I just found out I'm a ${seal.name}! 🦭 What seal are you? Take the quiz:`);
  const shareUrl = encodeURIComponent(window.location.href);
  document.getElementById('share-fb').href = `https://www.facebook.com/sharer/sharer.php?u=${shareUrl}`;
  document.getElementById('share-tw').href = `https://twitter.com/intent/tweet?text=${shareText}%20${shareUrl}`;

  showScreen('screen-result');
}

function retakeQuiz() {
  startQuiz();
}

// ─── INIT ────────────────────────────────────────────────────────────────────
createBubbles();
</script>

<script>
// Auto-resize: posts content height to parent frame after every screen change
function reportHeight() {
  var h = document.body.scrollHeight;
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'seal-quiz-height', height: h }, '*');
  }
}
// Patch showScreen to report height after each transition
var _origShowScreen = showScreen;
showScreen = function(id) {
  _origShowScreen(id);
  setTimeout(reportHeight, 520); // after fadeUp animation (500ms)
};
// Also report on load
window.addEventListener('load', function() { setTimeout(reportHeight, 100); });
</script>
